<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web CMS / IDE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
</head>
<body>
  <!-- Overlay Global de Carregamento -->
  <div id="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <p id="loading-message">Carregando...</p>
  </div>

  <!-- Contêiner de Notificações Toast -->
  <div id="toast-container"></div>

  <!-- Modal de Preview ao Vivo -->
  <div id="preview-modal" style="display: none;">
    <div class="preview-content">
      <div class="preview-header">
        <h3>Visualização ao Vivo</h3>
        <button id="close-preview-btn" class="danger-btn"><span class="btn-icon">✖</span> <span class="btn-label">Fechar</span></button>
      </div>
      <iframe id="preview-frame"></iframe>
    </div>
  </div>

  <div id="app">
    <!-- Cabeçalho Principal Global -->
    <header class="app-header" id="main-header">
      <h1>Web CMS / IDE</h1>

      <!-- Ações da Tela Inicial (Apenas Ajuda e Tema no canto superior direito) -->
      <div id="login-header-tools" class="header-tools-group">
        <button id="login-theme-btn" class="icon-btn" title="Alternar Tema Claro/Escuro">🌙</button>
        <a href="help.html" target="_blank" id="login-help-btn" class="icon-btn help-btn-link" title="Como configurar o Token e VS Code">❓</a>
      </div>

      <!-- Ações do Cabeçalho Superior (Configurações e Logout - Pós Login) -->
      <div id="header-actions-wrapper" style="display: none;" class="header-tools-group">
        <!-- Botão de Configurações + Menu Flutuante -->
        <div id="settings-wrapper">
          <button id="settings-toggle-btn" class="icon-btn" title="Configurações">⚙️</button>

          <!-- Popover Flutuante de Configurações (Abre sempre para baixo) -->
          <div id="settings-popover" class="popover-hidden">
            <div class="popover-menu-item" id="popover-theme-item">
              <span class="menu-label">Tema:</span>
              <button id="popover-theme-btn" class="secondary-btn flex-btn">🌙 Escuro</button>
            </div>
            <div class="popover-menu-item">
              <span class="menu-label">Idioma:</span>
              <select id="popover-lang-select" class="menu-select">
                <option value="pt-BR">Português (PT-BR)</option>
                <option value="en-US">English (EN)</option>
              </select>
            </div>
            <div class="popover-menu-item">
              <a href="help.html" target="_blank" class="help-link-btn">❓ Central de Ajuda</a>
            </div>
          </div>
        </div>

        <!-- Botão de Desligar Vermelho + Menu Flutuante -->
        <div id="logout-wrapper">
          <button id="power-toggle-btn" class="power-btn" title="Desconectar / Trocar Token">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
              <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
          </button>

          <!-- Popover Flutuante de Confirmação (Abre para esquerda no Desktop) -->
          <div id="logout-popover" class="popover-hidden">
            <button id="logout-btn" class="danger-btn">Desconectar / Trocar Token</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Tela de Autenticação -->
    <section id="login-section">
      <h2>Autenticação</h2>
      <p style="margin-top: 10px;">Insira seu Personal Access Token do GitHub para conectar:</p>
      <input type="password" id="token-input" placeholder="ghp_..." />
      <button id="connect-btn">Conectar</button>
      <p id="auth-status"></p>
    </section>

    <!-- Painel de Repositórios -->
    <section id="dashboard-section" style="display: none;">
      <div class="dashboard-header">
        <h2>Meus Repositórios</h2>
        <button id="new-repo-btn">Novo +</button>
      </div>

      <ul id="repo-list"></ul>
    </section>

    <!-- Painel do Editor de Arquivos -->
    <section id="editor-section" style="display: none;">
      <div class="editor-top-bar">
        <h2 id="current-repo-title"></h2>
        <button id="back-to-repos-btn" title="Voltar aos Repositórios">
          <span class="btn-icon-back">⬅️</span> <span class="btn-text">Voltar aos Repositórios</span>
        </button>
      </div>

      <div class="workspace">
        <!-- Navegador de Arquivos -->
        <div class="file-explorer" id="file-explorer">
          <div class="explorer-header">
            <h3>Arquivos</h3>
            <div class="explorer-actions">
              <button id="toggle-delete-mode-btn" class="danger-btn explorer-btn" title="Modo de Exclusão">✖</button>
              <button id="new-folder-btn" class="explorer-btn" title="Nova Pasta">📁</button>
              <button id="new-file-btn" class="explorer-btn" title="Novo Arquivo">📄</button>
            </div>
          </div>
          <p id="current-path-display" class="path-display">/</p>
          <ul id="file-tree"></ul>
        </div>

        <!-- Área do Editor -->
        <div class="code-editor-area" id="code-editor-area">
          <div class="editor-header" id="editor-header-bar">
            <h3 id="current-file-title">Nenhum arquivo selecionado</h3>
            <div class="editor-actions">
              <button id="preview-btn" class="secondary-btn action-hidden" title="Preview">
                <span class="btn-icon">👁️</span> <span class="btn-label">Preview</span>
              </button>
              <button id="expand-btn" class="secondary-btn action-hidden" title="Expandir">
                <span id="expand-icon" class="icon-svg">
                  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                </span> 
                <span id="expand-text" class="btn-label">Expandir</span>
              </button>
              <button id="delete-file-btn" class="danger-btn action-hidden" title="Excluir">
                <span class="btn-icon">✖</span> <span class="btn-label">Excluir</span>
              </button>
              <button id="save-file-btn" class="save-disabled action-hidden" disabled title="Salvar">
                <span class="btn-icon">💾 </span> <span class="btn-label">Salvar</span>
              </button>
            </div>
          </div>
          
          <div id="monaco-container"></div>
          <textarea id="mobile-editor" placeholder="Selecione um arquivo..." style="display: none;"></textarea>

          <p id="editor-status"></p>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script src="js/github.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
