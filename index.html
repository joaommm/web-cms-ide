<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web CMS / IDE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
</head>
<body>
  <!-- Overlay Global de Carregamento -->
  <div id="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <p id="loading-message">Carregando...</p>
  </div>

  <!-- Contêiner de Notificações Toast -->
  <div id="toast-container"></div>

  <!-- Modal de Preview ao Vivo -->
  <div id="preview-modal" style="display: none;">
    <div class="preview-content">
      <div class="preview-header">
        <h3>Visualização ao Vivo</h3>
        <button id="close-preview-btn" class="danger-btn">Fechar ✖</button>
      </div>
      <iframe id="preview-frame"></iframe>
    </div>
  </div>

  <div id="app">
    <!-- Cabeçalho Principal Global -->
    <header class="app-header" id="main-header">
      <h1>Web CMS / IDE</h1>

      <!-- Botão de Desligar Vermelho + Menu Flutuante -->
      <div id="logout-wrapper" style="display: none;">
        <button id="power-toggle-btn" class="power-btn" title="Desconectar / Trocar Token">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </button>

        <!-- Popover Flutuante de Confirmação -->
        <div id="logout-popover" class="logout-popover-hidden">
          <button id="logout-btn" class="danger-btn">Desconectar / Trocar Token</button>
        </div>
      </div>
    </header>

    <!-- Tela de Autenticação -->
    <section id="login-section">
      <h2>Autenticação</h2>
      <p>Insira seu Personal Access Token do GitHub para conectar:</p>
      <input type="password" id="token-input" placeholder="ghp_..." />
      <button id="connect-btn">Conectar</button>
      <p id="auth-status"></p>
    </section>

    <!-- Painel de Repositórios -->
    <section id="dashboard-section" style="display: none;">
      <div class="dashboard-header">
        <h2>Meus Repositórios</h2>
        <button id="new-repo-btn">Novo +</button>
      </div>

      <ul id="repo-list"></ul>
    </section>

    <!-- Painel do Editor de Arquivos -->
    <section id="editor-section" style="display: none;">
      <div class="editor-top-bar">
        <h2 id="current-repo-title"></h2>
        <button id="back-to-repos-btn">⬅️  Voltar aos Repositórios</button>
      </div>

      <div class="workspace">
        <!-- Navegador de Arquivos -->
        <div class="file-explorer" id="file-explorer">
          <div class="explorer-header">
            <h3>Arquivos</h3>
            <div class="explorer-actions">
              <button id="toggle-delete-mode-btn" class="danger-btn" title="Modo de Exclusão">🗑️-</button>
              <button id="new-folder-btn" title="Nova Pasta">📁+</button>
              <button id="new-file-btn" title="Novo Arquivo">📄+</button>
            </div>
          </div>
          <p id="current-path-display" class="path-display">/</p>
          <ul id="file-tree"></ul>
        </div>

        <!-- Área do Editor -->
        <div class="code-editor-area" id="code-editor-area">
          <div class="editor-header" id="editor-header-bar">
            <h3 id="current-file-title">Nenhum arquivo selecionado</h3>
            <div class="editor-actions">
              <button id="preview-btn" class="secondary-btn action-hidden">👁️ Preview  </button>
              <button id="expand-btn" class="secondary-btn action-hidden">
                <span id="expand-icon" class="icon-svg">
                  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                </span> 
                <span id="expand-text">Expandir</span>
              </button>
              <button id="delete-file-btn" class="danger-btn action-hidden">Excluir</button>
              <button id="save-file-btn" class="save-disabled action-hidden" disabled>Salvar</button>
            </div>
          </div>
          
          <div id="monaco-container"></div>
          <textarea id="mobile-editor" placeholder="Selecione um arquivo..." style="display: none;"></textarea>

          <p id="editor-status"></p>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script src="js/github.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
