<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web CMS / IDE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
</head>
<body>
  <!-- Overlay Global de Carregamento -->
  <div id="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <p id="loading-message">Carregando...</p>
  </div>

  <!-- Contêiner de Notificações Toast -->
  <div id="toast-container"></div>

  <div id="app">
    <h1>Web CMS / IDE</h1>

    <!-- Tela de Autenticação -->
    <section id="login-section">
      <h2>Autenticação</h2>
      <p>Insira seu Personal Access Token do GitHub para conectar:</p>
      <input type="password" id="token-input" placeholder="ghp_..." />
      <button id="connect-btn">Conectar</button>
      <p id="auth-status"></p>
    </section>

    <!-- Painel de Repositórios -->
    <section id="dashboard-section" style="display: none;">
      <div class="dashboard-header">
        <h2>Meus Repositórios</h2>
        <button id="new-repo-btn">+ Novo Repositório</button>
      </div>
      <button id="logout-btn" class="danger-btn" style="margin-top: 10px;">Desconectar / Trocar Token</button>
      <ul id="repo-list"></ul>
    </section>

    <!-- Painel do Editor de Arquivos -->
    <section id="editor-section" style="display: none;">
      <button id="back-to-repos-btn">← Voltar aos Repositórios</button>
      <h2 id="current-repo-title"></h2>

      <div class="workspace">
        <!-- Navegador de Arquivos -->
        <div class="file-explorer">
          <div class="explorer-header">
            <h3>Arquivos</h3>
            <button id="new-file-btn" title="Novo Arquivo">+</button>
          </div>
          <p id="current-path-display" class="path-display">/</p>
          <ul id="file-tree"></ul>
        </div>

        <!-- Área do Editor -->
        <div class="code-editor-area">
          <div class="editor-header">
            <h3 id="current-file-title">Nenhum arquivo selecionado</h3>
            <div class="editor-actions">
              <button id="save-file-btn" style="display: none;">Guardar Alterações</button>
              <button id="delete-file-btn" class="danger-btn" style="display: none;">Excluir Arquivo</button>
            </div>
          </div>
          
          <!-- Editor Misto: Monaco para Desktop e Textarea para Mobile -->
          <div id="monaco-container"></div>
          <textarea id="mobile-editor" placeholder="Selecione um arquivo..." style="display: none;"></textarea>

          <p id="editor-status"></p>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script src="js/github.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
