<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web CMS / IDE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <h1>Web CMS / IDE</h1>

    <!-- Tela de Autenticação -->
    <section id="login-section">
      <h2>Autenticação!</h2>
      <p>Insira seu Personal Access Token do GitHub para conectar:</p>
      <input type="password" id="token-input" placeholder="ghp_..." />
      <button id="connect-btn">Conectar</button>
      <p id="auth-status"></p>
    </section>

    <!-- Painel de Repositórios -->
    <section id="dashboard-section" style="display: none;">
      <h2>Meus Repositórios:</h2>
      <ul id="repo-list"></ul>
    </section>

    <!-- Painel do Editor de Ficheiros -->
    <section id="editor-section" style="display: none;">
      <button id="back-to-repos-btn">← Voltar aos Repositórios</button>
      <h2 id="current-repo-title"></h2>

      <div class="workspace">
        <!-- Navegador de Ficheiros -->
        <div class="file-explorer">
          <h3>Ficheiros</h3>
          <ul id="file-tree"></ul>
        </div>

        <!-- Área de Edição -->
        <div class="code-editor-area">
          <h3 id="current-file-title">Nenhum ficheiro selecionado</h3>
          <textarea id="file-content" placeholder="Selecione um ficheiro para editar..."></textarea>
          <br>
          <button id="save-file-btn" style="display: none;">Guardar Alterações</button>
          <p id="editor-status"></p>
        </div>
      </div>
    </section>
  </div>

  <script src="js/github.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
